# Optimized Container Nginx configuration for your React SPA
# Replace /etc/nginx/conf.d/default.conf in your frontend container

server {
    listen 80;
    server_name localhost;

    # Define root once at server level
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Enable gzip compression - critical for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;  # Important for reverse proxy setup
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Trust proxy headers from main server
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.1.0/24;    # Your Docker Swarm overlay network
    set_real_ip_from 192.168.0.0/16; # Host network range
    real_ip_recursive on;

    # Service worker - must never be cached for PWA functionality
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Content-Type "application/javascript";
        etag off;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Content-Type "application/javascript";
        etag off;
    }

    # Manifest files for PWA
    location ~* \.(webmanifest|manifest\.json)$ {
        expires 1d;
        add_header Cache-Control "public";
        add_header Content-Type "application/manifest+json";
        etag on;
    }

    # Static JavaScript files - optimize based on your React build
    location ~* \.js$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        add_header Vary "Accept-Encoding";
        etag on;

        # Handle missing files gracefully
        try_files $uri =404;
    }

    # Static CSS files
    location ~* \.css$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        add_header Vary "Accept-Encoding";
        etag on;

        # Handle missing files gracefully
        try_files $uri =404;
    }

    # Images - medium-term caching
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Vary "Accept-Encoding";
        etag on;
    }

    # Fonts - long-term caching with CORS
    location ~* \.(woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Vary "Accept-Encoding";
        etag on;
    }

    # API calls should never reach this container (handled by main server)
    # But block them just in case
    location /api {
        return 404;
    }

    location /m-api {
        return 404;
    }

    # Health check endpoint for container monitoring
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "frontend-container-healthy\n";
    }

    # Specific handling for index.html - short cache for updates
    location = / {
        try_files /index.html =404;
        expires 5m;
        add_header Cache-Control "public, must-revalidate, max-age=300";
        add_header Vary "Accept-Encoding";
        etag on;
    }

    # Other HTML files
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        add_header Vary "Accept-Encoding";
        etag on;
    }

    # Static files in /static directory (common React build output)
    location /static/ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        add_header Vary "Accept-Encoding";
        etag on;

        # Try to serve the file, fallback to 404
        try_files $uri =404;
    }

    # Robots.txt and sitemap
    location ~* \.(txt|xml)$ {
        expires 1d;
        add_header Cache-Control "public";
        etag on;
    }

    # Fallback for SPA routing - serve index.html for all unmatched routes
    # This has the lowest specificity and handles React Router
    location / {
        try_files $uri $uri/ /index.html;

        # For SPA routes, apply index.html caching rules
        expires 5m;
        add_header Cache-Control "public, must-revalidate, max-age=300";
        add_header Vary "Accept-Encoding";
        etag on;
    }

    # Error pages
    error_page 404 /index.html;  # SPA handles 404s
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        add_header Cache-Control "no-cache";
        etag off;
    }
}
